schema:
  schema_id: shi_emoji
  name: 诗Emoji
  version: "0.1.0"
  description: 构建时进行语义匹配，运行时使用离线拼音词典。
engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - table_translator
    - punct_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: shi_emoji
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
  comment_format:
    - xform/.*//
menu:
  page_size: 6
key_binder:
  bindings:
    - { when: has_menu, accept: bracketleft, send: Page_Up }
    - { when: has_menu, accept: bracketright, send: Page_Down }
punctuator:
  import_preset: default

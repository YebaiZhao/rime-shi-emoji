name: 缺词、误联想或运行问题
description: 提供脱敏的复现步骤，帮助区分输入方案、词库与插件问题。
title: '[反馈] '
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境与偏好
      description: 插件版本、系统、Rime 前端/方案版本、肤色/性别/重口联想开关状态。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 输入与实际结果
      description: 拼音输入、完整中文候选、实际表情及复现步骤。请勿上传私人聊天或用户词库。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你期望的结果
      description: 允许“这句话不该加表情”；提供你认为合理的词义或表情。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 可选的脱敏日志或截图
      description: 只贴相关内容，移除路径中的个人信息、账号、密钥及私人文本。
